import_smard_prices:
  name: SMARD-Preise importieren
  description: Börsenpreise aus einer SMARD-CSV in die Statistik des Preissensors schreiben und danach neu berechnen.
  fields:
    file:
      name: Datei
      description: Pfad zur CSV-Datei auf dem HA-Host, z. B. /config/www/smard.csv
      required: true
      example: /config/www/smard.csv
      selector:
        text:

import_energy_charts_prices:
  name: Energy-Charts-Preise importieren
  description: Börsenpreise (DE-LU) von der Energy-Charts-API für einen Zeitraum holen, in die Preis-Statistik schreiben und neu berechnen.
  fields:
    start:
      name: Von
      description: Erster Tag (JJJJ-MM-TT, Ortszeit)
      required: true
      example: "2025-01-01"
      selector:
        text:
    end:
      name: Bis
      description: Letzter Tag, einschließlich (JJJJ-MM-TT). Leer = heute.
      example: "2025-12-31"
      selector:
        text:
